# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Run from the repo root: scripts/run.sh browser-probe [git-ref] [provider-filter]
description: browser-probe skill, live sites

prompts:
  - |
    Our headless Chrome automation (playwright-cli) needs to load {{url}}.
    Find out whether bot protection is getting in the way and, if so, set up
    what our playwright-cli tooling needs to load the page (it reads a
    `browser-recipe.json`). Put every output file in ./out/ (relative to your
    working directory). Then summarize in a few sentences.

x-base: &base
  working_dir: workspace/browser-probe
  workspace_root: live-out/browser-probe
  skills: [workspace/browser-probe/.claude/skills/browser-probe]
  timeout_ms: 120000 # hard budget for the whole session: slower counts as a failure

providers:
  - id: file://../../providers/pi-provider.mjs
    label: sonnet-5.5-low
    config:
      <<: *base
      model_label: sonnet-5.5-low
  - id: file://../../providers/pi-provider.mjs
    label: haiku-5.5-low
    config:
      <<: *base
      model_label: haiku-5.5-low
  - id: file://../../providers/pi-provider.mjs
    label: qwen3.8-27b-cf
    config:
      <<: *base
      model_label: qwen3.8-27b-cf
  - id: file://../../providers/pi-provider.mjs
    label: gpt-6-sol-low
    config:
      <<: *base
      model_label: gpt-6-sol-low
  - id: file://../../providers/pi-provider.mjs
    label: gemma-4-26b-cf
    config:
      <<: *base
      model_label: gemma-4-26b-cf

defaultTest:
  assert:
    - type: skill-used
      value: browser-probe
    - type: javascript
      value: file://assert-live.mjs:reportAndRecipeConsistent
    - type: javascript
      value: file://assert-live.mjs:recipeLoadsPage
    - type: javascript
      value: file://assert-live.mjs:matchesExpectedTier
      weight: 0
    - type: latency # informational: flags sessions slower than 1 minute
      threshold: 60000
      weight: 0

evaluateOptions:
  maxConcurrency: 4
  timeoutMs: 150000

tests: file://sites.yaml
